name: Collecte météo et NOTAM

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer METAR, TAF et NOTAM
        run: python scripts/fetch_data.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "collecte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wx.json
          git diff --cached --quiet && exit 0
          git commit -m "Données météo $(date -u +%d/%m\ %H:%MZ)"
          git pull --rebase --autostash
          git push
